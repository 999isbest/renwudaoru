<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络侦探 - 赛博朋克任务卡</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft Yahei", monospace;
        }

        /* 外层容器：以电脑边框为背景，居中显示 */
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 电脑边框容器：控制整体尺寸和背景图 */
        .computer-frame {
            position: relative;
            width: 95%; /* 适配屏幕宽度，避免溢出 */
            max-width: 1200px; /* 边框图的最大宽度 */
            aspect-ratio: 16/9; /* 保持屏幕比例 */
            background-image: url("https://p11-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/d902ecbbf74045e49e76fb3ee1caf63b.png~tplv-a9rns2rl98-24:720:720.png?lk3s=8e244e95&rcl=2026012002502376243478C78B523B295F&rrcfp=8a172a1a&x-expires=1769453423&x-signature=4D7KDUHa1VxbjZ5x89axgZkVEQ4%3D");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 显示屏内容区域：精准匹配边框内的屏幕位置 */
        .screen-content {
            position: absolute;
            /* 调整内边距，精准嵌入屏幕区域（根据边框图比例微调） */
            top: 5.5%;
            left: 9.5%;
            width: 80.5%;
            height: 88%;
            background: #000;
            overflow: auto; /* 内容超出时滚动 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* 赛博朋克核心卡片样式 */
        .detective-card {
            display: flex;
            width: 100%;
            max-width: 850px; /* 适配屏幕内宽度 */
            height: 100%;
            max-height: 500px;
            background: #0a0a14;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.4),
                0 0 30px rgba(255, 0, 255, 0.3);
            overflow: hidden;
            position: relative;
            /* 卡片扫描线动态效果 */
            animation: scanline 8s linear infinite;
            /* 新增：卡片呼吸发光效果 */
            animation: cardPulse 4s ease-in-out infinite alternate;
            /* 新增：初始载入动画 */
            opacity: 0;
            transform: translateY(20px);
            animation: cardLoad 1.5s ease-out forwards 0.5s;
        }

        /* 新增：卡片载入动画 */
        @keyframes cardLoad {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 新增：卡片呼吸发光效果 */
        @keyframes cardPulse {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), 0 0 30px rgba(255, 0, 255, 0.3);
                border-color: #ff00ff;
            }
            100% {
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), 0 0 40px rgba(255, 0, 255, 0.5);
                border-color: #00ffff;
            }
        }

        /* 扫描线动画 */
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
        .detective-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        /* 新增：数字雨背景效果（覆盖卡片） */
        .detective-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(transparent, transparent),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='0' y='50' font-family='monospace' font-size='10' fill='rgba(0,255,255,0.1)'%3E01010101%3C/text%3E%3C/svg%3E");
            background-size: 50px 100px;
            background-repeat: repeat;
            z-index: 1;
            pointer-events: none;
            animation: digitalRain 15s linear infinite;
            opacity: 0.3;
        }

        /* 新增：数字雨动画 */
        @keyframes digitalRain {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* 左侧图片区域 */
        .card-img {
            flex: 0 0 320px; /* 适配屏幕内宽度，缩小图片区 */
            background: #111119;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-right: 1px solid #00ffff;
            /* 新增：图片区hover效果 */
            transition: background 0.3s ease;
        }

        /* 新增：图片区hover变色 */
        .card-img:hover {
            background: #1a1a2e;
        }

        .detective-silhouette {
            width: 100%;
            height: auto;
            /* 赛博朋克图片滤镜 - 适配新图片色调 */
            filter:
                contrast(1.2)
                drop-shadow(0 0 12px #9d00ff)
                brightness(1.1);
            /* 轻微故障晃动 */
            animation: glitch-img 6s infinite alternate;
            /* 新增：图片hover放大效果 */
            transition: transform 0.3s ease;
        }

        /* 新增：图片hover放大 */
        .detective-silhouette:hover {
            transform: scale(1.05);
            filter:
                contrast(1.3)
                drop-shadow(0 0 15px #00ffff)
                brightness(1.2);
        }

        @keyframes glitch-img {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        /* 右侧文本内容区域 */
        .card-content {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 28px; /* 适配屏幕内尺寸，缩小标题 */
            color: #00ffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #ff00ff;
            padding-bottom: 10px;
            /* 霓虹文字发光 */
            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 15px #00ffff;
            /* 文字故障动画 */
            position: relative;
            animation: glitch-text 2s infinite;
            /* 新增：标题打字机效果 */
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #00ffff;
            width: 0;
            animation:
                glitch-text 2s infinite,
                typing 2s steps(10, end) forwards 1s,
                blinkCursor 0.7s infinite;
        }

        /* 新增：打字机动画 */
        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        /* 新增：光标闪烁动画 */
        @keyframes blinkCursor {
            from { border-right-color: #00ffff; }
            to { border-right-color: transparent; }
        }

        /* 文字故障效果 */
        @keyframes glitch-text {
            0%, 100% { transform: translate(0); }
            5% { transform: translate(-2px, 2px); }
            10% { transform: translate(2px, -2px); }
        }
        .card-title::before, .card-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card-title::before {
            color: #ff00ff;
            left: 2px;
            top: 2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }
        .card-title::after {
            color: #00ffff;
            left: -2px;
            top: -2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }

        /* 正文字号（已增大2号），重点内容高亮 */
        .card-text {
            font-size: 19px;
            line-height: 1.8;
            color: #ffffff;
            margin-top: 8px; /* 核心修改：调整为8px实现向下偏移0.5字节的视觉效果 */
            margin-bottom: 18px;
            position: relative;
            /* 新增：文本逐行淡入动画 */
            opacity: 0;
            transform: translateX(20px);
            animation: textFadeIn 0.8s ease-out forwards;
        }

        /* 新增：文本逐行动画（错开延迟） */
        .card-text:nth-child(2) {
            animation-delay: 2s;
        }

        @keyframes textFadeIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 重点突出的文本样式 */
        .highlight-text {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 6px #00ffff;
            /* 新增：重点文字闪烁效果 */
            animation: highlightPulse 2s ease-in-out infinite alternate;
        }

        /* 新增：重点文字闪烁 */
        @keyframes highlightPulse {
            0% { text-shadow: 0 0 6px #00ffff; }
            100% { text-shadow: 0 0 12px #00ffff, 0 0 20px #ff00ff; }
        }

        .card-text::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 0;
            color: #ff00ff;
            opacity: 0.4;
            z-index: -1;
        }

        /* 新增：强调文本的下划线样式（不突兀） */
        .emphasis-line {
            display: inline-block;
            position: relative;
            padding-bottom: 2px;
        }

        .emphasis-line::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(0,255,255,0.8), rgba(0,255,255,0.2));
            box-shadow: 0 0 3px rgba(0,255,255,0.5);
            border-radius: 1px;
        }

        /* 新增：开始调查按钮样式 */
        .investigate-btn {
            margin-top: 30px;
            padding: 12px 35px;
            background: linear-gradient(45deg, #001133, #002266);
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            /* 按钮载入动画（和文本错开延迟） */
            opacity: 0;
            transform: translateY(15px);
            animation: btnFadeIn 0.8s ease-out forwards 2.8s;
        }

        /* 按钮载入动画 */
        @keyframes btnFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 按钮hover效果 */
        .investigate-btn:hover {
            background: linear-gradient(45deg, #002266, #003399);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 25px rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* 按钮点击波纹效果 */
        .investigate-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .investigate-btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        /* 响应式适配：小屏幕下调整布局和尺寸 */
        @media (max-width: 768px) {
            .detective-card {
                flex-direction: column;
                max-height: none;
            }
            .card-img {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #00ffff;
                padding: 15px;
            }
            .card-content {
                padding: 25px 20px;
            }
            .card-title {
                font-size: 24px;
                animation:
                    glitch-text 2s infinite,
                    typing 2s steps(8, end) forwards 1s,
                    blinkCursor 0.7s infinite;
            }
            .card-text {
                font-size: 19px;
                margin-top: 8px; /* 移动端同步偏移 */
            }
            /* 移动端按钮适配 */
            .investigate-btn {
                padding: 10px 25px;
                font-size: 16px;
                margin-top: 25px;
            }
            /* 移动端调整屏幕内容区域的位置 */
            .screen-content {
                top: 6%;
                left: 10%;
                width: 79%;
                height: 87%;
            }
        }
    </style>
</head>
<body>
    <!-- 电脑边框容器 -->
    <div class="computer-frame">
        <!-- 显示屏内的内容区域 -->
        <div class="screen-content">
            <!-- 原有人物介绍卡片 -->
            <div class="detective-card">
                <!-- 左侧：网络侦探图片 -->
                <div class="card-img">
                    <img src="https://p3-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/959803284c6f4bca83b62b2e13f5bf54.png~tplv-a9rns2rl98-24:720:720.png?lk3s=8e244e95&rcl=2026012002234132A244C801384C40811F&rrcfp=8a172a1a&x-expires=1769451821&x-signature=89aNsffPJY11zey2uoTzfmgze9E%3D" alt="网络侦探剪影" class="detective-silhouette">
                </div>

                <!-- 右侧：标题和文本内容 -->
                <div class="card-content">

                    <p class="card-text" data-text="你是一位网络侦探，以维护网络和平与安全为己任。一天，你收到了一封来自网络清朗公益组织的任务委托，这份委托似乎与近期兴起的“参考文献”梗有关。你的任务就是抽丝剥茧，调查梗表达异化的根源，守护网络空间的清朗与安全。">
                        <span class="emphasis-line">你是一位<span class="highlight-text">网络侦探</span>，以维护网络和平与安全为己任。</span><br>
                        一天，你收到了一封来自网络清朗公益组织的任务委托，这份委托似乎与近期兴起的<span class="highlight-text">“参考文献”梗</span>有关。你的任务就是抽丝剥茧，调查<span class="highlight-text">梗表达异化</span>的根源，守护网络空间的清朗与安全。
                    </p>
                    <!-- 新增：开始调查按钮 - 添加点击跳转功能 -->
                    <button class="investigate-btn" onclick="window.location.href='https://999isbest.github.io/e-mail/'">开始调查</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
