<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>网络侦探 - 赛博朋克任务卡</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft Yahei", monospace;
        }

        /* 外层容器：以电脑边框为背景，居中显示 */
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px; /* 减小移动端内边距 */
            touch-action: manipulation; /* 优化移动端触摸行为 */
        }

        /* 电脑边框容器：控制整体尺寸和背景图 */
        .computer-frame {
            position: relative;
            width: 100%; /* 移动端占满宽度 */
            max-width: 1200px;
            aspect-ratio: 16/9;
            background-image: url("https://p11-flow-imagex-download-sign.byteimg.com/tos-cn-i-a9rns2rl98/d902ecbbf74045e49e76fb3ee1caf63b.png~tplv-a9rns2rl98-24:720:720.png?lk3s=8e244e95&rcl=2026012002502376243478C78B523B295F&rrcfp=8a172a1a&x-expires=1769453423&x-signature=4D7KDUHa1VxbjZ5x89axgZkVEQ4%3D");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 显示屏内容区域：精准匹配边框内的屏幕位置 */
        .screen-content {
            position: absolute;
            top: 5.5%;
            left: 9.5%;
            width: 80.5%;
            height: 88%;
            background: #000;
            overflow-y: auto; /* 仅垂直滚动 */
            overflow-x: hidden; /* 禁止水平滚动 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            -webkit-overflow-scrolling: touch; /* 移动端顺滑滚动 */
        }

        /* 赛博朋克核心卡片样式 */
        .detective-card {
            display: flex;
            width: 100%;
            max-width: 850px;
            height: 100%;
            max-height: 500px;
            background: #0a0a14;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.4),
                0 0 30px rgba(255, 0, 255, 0.3);
            overflow: hidden;
            position: relative;
            animation: scanline 8s linear infinite;
            animation: cardPulse 4s ease-in-out infinite alternate;
            opacity: 0;
            transform: translateY(20px);
            animation: cardLoad 1.5s ease-out forwards 0.5s;
        }

        @keyframes cardLoad {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardPulse {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), 0 0 30px rgba(255, 0, 255, 0.3);
                border-color: #ff00ff;
            }
            100% {
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), 0 0 40px rgba(255, 0, 255, 0.5);
                border-color: #00ffff;
            }
        }

        /* 扫描线动画 */
        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
        .detective-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .detective-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(transparent, transparent),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='0' y='50' font-family='monospace' font-size='10' fill='rgba(0,255,255,0.1)'%3E01010101%3C/text%3E%3C/svg%3E");
            background-size: 50px 100px;
            background-repeat: repeat;
            z-index: 1;
            pointer-events: none;
            animation: digitalRain 15s linear infinite;
            opacity: 0.3;
        }

        @keyframes digitalRain {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* 左侧图片区域 */
        .card-img {
            flex: 0 0 320px;
            background: #111119;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-right: 1px solid #00ffff;
            transition: background 0.3s ease;
        }

        .card-img:hover {
            background: #1a1a2e;
        }

        .detective-silhouette {
            width: 100%;
            height: auto;
            filter:
                contrast(1.2)
                drop-shadow(0 0 12px #9d00ff)
                brightness(1.1);
            animation: glitch-img 6s infinite alternate;
            transition: transform 0.3s ease;
        }

        .detective-silhouette:hover {
            transform: scale(1.05);
            filter:
                contrast(1.3)
                drop-shadow(0 0 15px #00ffff)
                brightness(1.2);
        }

        @keyframes glitch-img {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        /* 右侧文本内容区域 */
        .card-content {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 28px;
            color: #00ffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #ff00ff;
            padding-bottom: 10px;
            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 15px #00ffff;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #00ffff;
            width: 0;
            animation:
                glitch-text 2s infinite,
                typing 2s steps(10, end) forwards 1s,
                blinkCursor 0.7s infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blinkCursor {
            from { border-right-color: #00ffff; }
            to { border-right-color: transparent; }
        }

        @keyframes glitch-text {
            0%, 100% { transform: translate(0); }
            5% { transform: translate(-2px, 2px); }
            10% { transform: translate(2px, -2px); }
        }
        .card-title::before, .card-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card-title::before {
            color: #ff00ff;
            left: 2px;
            top: 2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }
        .card-title::after {
            color: #00ffff;
            left: -2px;
            top: -2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }

        /* 正文字号 */
        .card-text {
            font-size: 19px;
            line-height: 1.8;
            color: #ffffff;
            margin-top: 8px;
            margin-bottom: 18px;
            position: relative;
            opacity: 0;
            transform: translateX(20px);
            animation: textFadeIn 0.8s ease-out forwards;
        }

        .card-text:nth-child(2) {
            animation-delay: 2s;
        }

        @keyframes textFadeIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 重点突出的文本样式 */
        .highlight-text {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 6px #00ffff;
            animation: highlightPulse 2s ease-in-out infinite alternate;
        }

        @keyframes highlightPulse {
            0% { text-shadow: 0 0 6px #00ffff; }
            100% { text-shadow: 0 0 12px #00ffff, 0 0 20px #ff00ff; }
        }

        .card-text::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 0;
            color: #ff00ff;
            opacity: 0.4;
            z-index: -1;
        }

        .emphasis-line {
            display: inline-block;
            position: relative;
            padding-bottom: 2px;
        }

        .emphasis-line::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(0,255,255,0.8), rgba(0,255,255,0.2));
            box-shadow: 0 0 3px rgba(0,255,255,0.5);
            border-radius: 1px;
        }

        /* 开始调查按钮样式 */
        .investigate-btn {
            margin-top: 30px;
            padding: 12px 35px;
            background: linear-gradient(45deg, #001133, #002266);
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(15px);
            animation: btnFadeIn 0.8s ease-out forwards 2.8s;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        @keyframes btnFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .investigate-btn:hover, .investigate-btn:active { /* 增加active状态适配触摸 */
            background: linear-gradient(45deg, #002266, #003399);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 25px rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .investigate-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .investigate-btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        /* ---------- 移动端适配优化 (768px以下) ---------- */
        @media (max-width: 768px) {
            /* 调整body布局，适配小屏幕 */
            body {
                padding: 5px;
                min-height: 100vh;
                align-items: flex-start; /* 避免内容被截断 */
                padding-top: 20px;
                padding-bottom: 20px;
            }

            /* 电脑边框容器适配 */
            .computer-frame {
                aspect-ratio: unset; /* 取消固定比例 */
                min-height: 80vh; /* 保证最小高度 */
                height: auto;
                padding: 10px 0;
            }

            /* 屏幕内容区域精准适配 */
            .screen-content {
                top: 4%;
                left: 6%;
                width: 88%;
                height: 92%;
                padding: 10px;
            }

            /* 卡片改为垂直布局 */
            .detective-card {
                flex-direction: column;
                max-height: none;
                height: 100%;
                min-height: 600px; /* 保证卡片最小高度 */
            }

            /* 图片区域适配 */
            .card-img {
                flex: none;
                width: 100%;
                border-right: none;
                border-bottom: 1px solid #00ffff;
                padding: 15px;
                min-height: 200px; /* 保证图片区域高度 */
            }

            /* 文本内容区域适配 */
            .card-content {
                padding: 20px 15px;
                flex: 1;
                justify-content: space-around; /* 均匀分布内容 */
            }

            /* 标题适配 */
            .card-title {
                font-size: 22px;
                margin-bottom: 15px;
                padding-bottom: 8px;
                /* 调整打字机动画适配小屏幕 */
                animation:
                    glitch-text 2s infinite,
                    typing 2s steps(8, end) forwards 1s,
                    blinkCursor 0.7s infinite;
            }

            /* 正文适配 */
            .card-text {
                font-size: 17px;
                line-height: 1.6;
                margin-top: 8px;
                margin-bottom: 15px;
            }

            /* 按钮适配 */
            .investigate-btn {
                padding: 12px 30px;
                font-size: 17px;
                margin-top: 20px;
                width: 100%; /* 按钮占满宽度 */
                max-width: 300px; /* 限制最大宽度 */
                align-self: center; /* 居中显示 */
            }

            /* 优化动画性能 */
            .detective-card::after {
                background-size: 30px 80px; /* 缩小数字雨图案 */
                animation-duration: 20s; /* 减慢动画速度 */
            }

            /* 调整故障动画幅度 */
            @keyframes glitch-img {
                0%, 100% { transform: translate(0); }
                20% { transform: translate(-0.5px, 0.5px); }
                40% { transform: translate(0.5px, -0.5px); }
                60% { transform: translate(-0.5px, -0.5px); }
                80% { transform: translate(0.5px, 0.5px); }
            }
        }

        /* 小屏手机额外适配 (480px以下) */
        @media (max-width: 480px) {
            .computer-frame {
                min-height: 90vh;
            }
            
            .detective-card {
                min-height: 550px;
            }
            
            .card-title {
                font-size: 20px;
            }
            
            .card-text {
                font-size: 16px;
            }
            
            .investigate-btn {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>

        <!-- 显示屏内的内容区域 -->
        <div class="screen-content">

            <div class="detective-card">

                <div class="card-img">

                </div>
            </div>
        </div>
    </div>
</body>
</html>
