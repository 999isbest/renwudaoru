<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>网络侦探 - 任务载入中</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Consolas", "Microsoft Yahei", monospace;
        }

        /* 外层容器：基础样式，移除全局overflow: hidden */
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 防止动画闪烁 */
            backface-visibility: hidden;
            transform: translateZ(0);
            /* 初始状态不旋转 */
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* 电脑边框容器：控制整体尺寸和背景图 */
        .computer-frame {
            position: relative;
            width: 95%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background-image: url("https://i.imgs.ovh/2026/02/07/ydM5C0.png");
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 保证容器层级和渲染 */
            z-index: 1;
        }

        /* 显示屏内容区域：精准匹配边框内的屏幕位置 */
        .screen-content {
            position: absolute;
            top: 5.5%;
            left: 9.5%;
            width: 80.5%;
            height: 88%;
            background: #000;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* 滚动条美化（移动端隐藏） */
            scrollbar-width: thin;
            scrollbar-color: #00ffff #0a0a14;
        }
        .screen-content::-webkit-scrollbar {
            display: none;
        }

        /* 赛博朋克核心卡片样式 */
        .detective-card {
            display: flex;
            width: 100%;
            max-width: 850px;
            height: 100%;
            max-height: 500px;
            background: #0a0a14;
            border: 1px solid #ff00ff;
            border-radius: 8px;
            box-shadow:
                0 0 15px rgba(0, 255, 255, 0.4),
                0 0 30px rgba(255, 0, 255, 0.3);
            overflow: hidden;
            position: relative;
            animation: scanline 8s linear infinite,
                       cardPulse 4s ease-in-out infinite alternate,
                       cardLoad 1.5s ease-out forwards 0.5s;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardLoad {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardPulse {
            0% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), 0 0 30px rgba(255, 0, 255, 0.3);
                border-color: #ff00ff;
            }
            100% {
                box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), 0 0 40px rgba(255, 0, 255, 0.5);
                border-color: #00ffff;
            }
        }

        @keyframes scanline {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }
        .detective-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                transparent 50%,
                rgba(0, 255, 255, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
        }

        .detective-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(transparent, transparent),
                url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='0' y='50' font-family='monospace' font-size='10' fill='rgba(0,255,255,0.1)'%3E01010101%3C/text%3E%3C/svg%3E");
            background-size: 50px 100px;
            background-repeat: repeat;
            z-index: 1;
            pointer-events: none;
            animation: digitalRain 15s linear infinite;
            opacity: 0.3;
        }

        @keyframes digitalRain {
            0% { background-position: 0 0; }
            100% { background-position: 0 100px; }
        }

        /* 左侧图片区域 - 核心调整：优化容器尺寸和图片适配 */
        .card-img {
            flex: 0 0 280px; /* 从320px调整为280px，更紧凑 */
            background: #111119;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px; /* 减少内边距，让图片显示更充分 */
            border-right: 1px solid #00ffff;
            transition: background 0.3s ease;
        }

        .card-img:hover {
            background: #1a1a2e;
        }

        .detective-silhouette {
            width: 90%; /* 从100%调整为90%，留出呼吸空间 */
            max-height: 90%; /* 新增：限制最大高度，防止溢出 */
            height: auto;
            object-fit: contain; /* 新增：保持图片比例，不拉伸 */
            /* 微调滤镜适配新图片色调 */
            filter:
                contrast(1.15)
                drop-shadow(0 0 15px #7b00ff)
                brightness(1.05);
            animation: glitch-img 6s infinite alternate;
            transition: transform 0.3s ease;
        }

        .detective-silhouette:hover {
            transform: scale(1.05);
            filter:
                contrast(1.3)
                drop-shadow(0 0 20px #00ffff)
                brightness(1.2);
        }

        @keyframes glitch-img {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-1px, 1px); }
            40% { transform: translate(1px, -1px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
        }

        /* 右侧文本内容区域 */
        .card-content {
            flex: 1;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 28px;
            color: #00ffff;
            margin-bottom: 20px;
            border-bottom: 1px solid #ff00ff;
            padding-bottom: 10px;
            text-shadow:
                0 0 5px #00ffff,
                0 0 10px #00ffff,
                0 0 15px #00ffff;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #00ffff;
            width: 0;
            animation:
                glitch-text 2s infinite,
                typing 2s steps(10, end) forwards 1s,
                blinkCursor 0.7s infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blinkCursor {
            from { border-right-color: #00ffff; }
            to { border-right-color: transparent; }
        }

        @keyframes glitch-text {
            0%, 100% { transform: translate(0); }
            5% { transform: translate(-2px, 2px); }
            10% { transform: translate(2px, -2px); }
        }
        .card-title::before, .card-title::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .card-title::before {
            color: #ff00ff;
            left: 2px;
            top: 2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }
        .card-title::after {
            color: #00ffff;
            left: -2px;
            top: -2px;
            clip: rect(44px, 450px, 56px, 0);
            z-index: -1;
        }

        .card-text {
            font-size: 19px;
            line-height: 1.8;
            color: #ffffff;
            margin-top: 8px;
            margin-bottom: 18px;
            position: relative;
            opacity: 0;
            transform: translateX(20px);
            animation: textFadeIn 0.8s ease-out forwards 2s;
        }

        @keyframes textFadeIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .highlight-text {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 6px #00ffff;
            animation: highlightPulse 2s ease-in-out infinite alternate;
        }

        @keyframes highlightPulse {
            0% { text-shadow: 0 0 6px #00ffff; }
            100% { text-shadow: 0 0 12px #00ffff, 0 0 20px #ff00ff; }
        }

        .card-text::after {
            content: attr(data-text);
            position: absolute;
            left: 2px;
            top: 0;
            color: #ff00ff;
            opacity: 0.4;
            z-index: -1;
        }

        .emphasis-line {
            display: inline-block;
            position: relative;
            padding-bottom: 2px;
        }

        .emphasis-line::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, rgba(0,255,255,0.2), rgba(0,255,255,0.8), rgba(0,255,255,0.2));
            box-shadow: 0 0 3px rgba(0,255,255,0.5);
            border-radius: 1px;
        }

        .investigate-btn {
            margin-top: 30px;
            padding: 12px 35px;
            background: linear-gradient(45deg, #001133, #002266);
            border: 1px solid #00ffff;
            border-radius: 4px;
            color: #00ffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            text-shadow: 0 0 8px #00ffff;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(15px);
            animation: btnFadeIn 0.8s ease-out forwards 2.8s;
            /* 修复触摸事件：强制开启点击响应 */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes btnFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .investigate-btn:hover {
            background: linear-gradient(45deg, #002266, #003399);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6), 0 0 25px rgba(255, 0, 255, 0.4);
            border-color: #ff00ff;
            color: #ffffff;
            transform: translateY(-2px);
        }

        .investigate-btn::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(0, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .investigate-btn:active::after {
            width: 300px;
            height: 300px;
            opacity: 0;
        }

        /* 手机端适配（768px以下） */
        @media only screen and (max-width: 768px) {
            body {
                transform: translate(-50%, -50%) rotate(90deg);
                width: 100vh;
                height: 100vw;
                position: fixed;
                top: 50%;
                left: 50%;
                padding: 0;
                margin: 0;
            }
            .computer-frame {
                width: 95%;
                height: 90%;
                max-width: none;
                aspect-ratio: unset;
            }
            .screen-content {
                top: 5.5%;
                left: 9.5%;
                width: 80.5%;
                height: 88%;
                padding: 10px;
            }
            .detective-card {
                flex-direction: row !important;
                max-height: none;
                max-width: none;
                height: 100%;
            }
            .card-img {
                flex: 0 0 200px;
                border-right: 1px solid #00ffff !important;
                border-bottom: none !important;
                padding: 10px;
            }
            .detective-silhouette {
                width: 90%;
                max-height: 90%;
            }
            .card-content {
                padding: 20px;
            }
            .card-title {
                font-size: 22px;
                animation:
                    glitch-text 2s infinite,
                    typing 2s steps(8, end) forwards 1s,
                    blinkCursor 0.7s infinite;
            }
            .card-text {
                font-size: 16px;
                line-height: 1.6;
                margin-top: 8px;
            }
            .investigate-btn {
                padding: 10px 25px;
                font-size: 15px;
                margin-top: 20px;
            }
            * {
                -webkit-tap-highlight-color: transparent;
            }
        }

        /* 平板设备适配（768px - 1024px） */
        @media only screen and (min-width: 769px) and (max-width: 1024px) {
            /* 平板横屏适配核心 */
            body {
                padding: 10px;
                min-height: 100vw;
                min-width: 100vh;
            }
            
            .computer-frame {
                width: 98%;
                max-width: none;
                aspect-ratio: 16/9;
                height: auto;
            }
            
            .screen-content {
                top: 5%;
                left: 9%;
                width: 81%;
                height: 89%;
                padding: 15px;
            }
            
            .detective-card {
                max-width: none;
                max-height: none;
                height: 100%;
                width: 100%;
            }
            
            .card-img {
                flex: 0 0 250px;
                padding: 12px;
            }
            
            .card-content {
                padding: 25px;
            }
            
            .card-title {
                font-size: 26px;
            }
            
            .card-text {
                font-size: 18px;
                line-height: 1.7;
            }
            
            .investigate-btn {
                padding: 11px 30px;
                font-size: 17px;
            }

            /* 检测平板竖屏时自动旋转为横屏 */
            @media (orientation: portrait) {
                body {
                    transform: rotate(90deg);
                    transform-origin: center center;
                    width: 100vh;
                    height: 100vw;
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    margin: -50vw 0 0 -50vh;
                }
            }
        }

        /* 大屏平板/小笔记本适配（1025px - 1200px） */
        @media only screen and (min-width: 1025px) and (max-width: 1200px) {
            .computer-frame {
                width: 95%;
            }
            
            .card-img {
                flex: 0 0 260px;
            }
            
            .card-title {
                font-size: 27px;
            }
            
            .card-text {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="computer-frame">
        <div class="screen-content">
            <div class="detective-card">
                <div class="card-img">
                    <img src="https://i.imgs.ovh/2026/02/07/ydMklg.png" class="detective-silhouette">
                </div>
                <div class="card-content">
                    <h2 class="card-title" data-text="任务载入中…">任务载入中…</h2>
                    <p class="card-text" data-text="你是一位网络侦探，以维护网络和平与安全为己任。一天，你收到了一封来自网络清朗公益组织的任务委托，这份委托似乎与近期兴起的“参考文献”梗有关。你的任务就是抽丝剥茧，调查梗表达异化的根源，守护网络空间的清朗与安全。">
                        <span class="emphasis-line">你是一位<span class="highlight-text">网络侦探</span>，以维护网络和平与安全为己任。</span><br>
                        一天，你收到了一封来自网络清朗公益组织的任务委托，这份委托似乎与近期兴起的<span class="highlight-text">“参考文献”梗</span>有关。你的任务就是抽丝剥茧，调查<span class="highlight-text">梗表达异化</span>的根源，守护网络空间的清朗与安全。
                    </p>
                    <button class="investigate-btn" onclick="window.location.href='https://999isbest.github.io/e-mail/'">开始调查</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增JS：检测设备方向并优化体验 -->
    <script>
        // 检测设备类型（平板/手机/桌面）
        function detectDeviceType() {
            const userAgent = navigator.userAgent.toLowerCase();
            const isTablet = /(ipad|tablet|(android(?!.*mobile))|(windows(?!.*phone)(.*touch))|kindle|playbook|silk|(puffin(?!.*(IP|AP|WP))))/.test(userAgent);
            const isMobile = /mobile|android|iphone|ipod|blackberry|iemobile|opera mini/.test(userAgent);
            return { isTablet: isTablet && !isMobile, isMobile };
        }

        // 监听屏幕方向变化
        window.addEventListener('orientationchange', function() {
            const { isTablet } = detectDeviceType();
            if (isTablet) {
                // 平板方向变化后重新适配
                document.body.style.transition = 'transform 0.3s ease';
                setTimeout(() => {
                    window.scrollTo(0, 0);
                }, 100);
            }
        });

        // 页面加载完成后初始化适配
        window.addEventListener('load', function() {
            const { isTablet } = detectDeviceType();
            if (isTablet) {
                // 平板设备强制横屏显示
                if (window.innerHeight > window.innerWidth) {
                    document.body.style.transform = 'rotate(90deg)';
                    document.body.style.transformOrigin = 'center center';
                    document.body.style.width = `${window.innerHeight}px`;
                    document.body.style.height = `${window.innerWidth}px`;
                    document.body.style.position = 'fixed';
                    document.body.style.top = '50%';
                    document.body.style.left = '50%';
                    document.body.style.marginTop = `-${window.innerWidth / 2}px`;
                    document.body.style.marginLeft = `-${window.innerHeight / 2}px`;
                }
            }
        });
    </script>
</body>
</html>
